apiVersion: ase.apple.com/kandbox/v1
kind: DeploymentConfig
metadata:
  name: filodb-fullstack
spec:
  deploy:
    - name: filodb-onebox
      type: deployment
      image: docker.apple.com/telemetry/mosaic-local:filodb-kandbox
      imagePullPolicy: IfNotPresent
      replicas: 1
      stage: 0
      securityContext:
        runAsContainerUser: true
      args:
        - "/bin/bash"
        - "-c"
        - "echo  | base64 -d > /tmp/run.sh && exec bash /tmp/run.sh"
      ports:
        - name: query
          port: 9900
          appProtocol: http
        - name: filodb
          port: 8080
          appProtocol: http
        - name: metro
          port: 8090
          appProtocol: http
        - name: gateway
          port: 9898
          appProtocol: http
      resources:
        requests:
          cpu: "6000m"
          memory: 16Gi
        limits:
          cpu: "12000m"
          memory: 48Gi
      readinessProbe:
        scheme: http
        path: /api/v1/cluster
        port: 8080
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 35
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 540
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
