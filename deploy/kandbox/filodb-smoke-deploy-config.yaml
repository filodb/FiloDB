apiVersion: ase.apple.com/kandbox/v1
kind: DeploymentConfig
metadata:
  name: filodb-smoke
spec:
  deploy:
    - name: filodb-onebox
      type: deployment
      image: docker.apple.com/telemetry/mosaic-local:filodb-kandbox
      imagePullPolicy: IfNotPresent
      replicas: 1
      stage: 0
      securityContext:
        runAsContainerUser: true
      args:
        - "/bin/bash"
        - "-c"
        - "echo  | base64 -d > /tmp/run.sh && exec bash /tmp/run.sh"
      ports:
        - name: main
          port: 8080
          appProtocol: http
      resources:
        requests:
          cpu: "4000m"
          memory: 12Gi
        limits:
          cpu: "6000m"
          memory: 16Gi
      readinessProbe:
        scheme: http
        path: /api/v1/cluster
        port: 8080
        initialDelaySeconds: 120
        periodSeconds: 15
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 40
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 600
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 15
  readiness:
    commands:
      - "curl -sf http://$FILODB_ONEBOX_HOST:$FILODB_ONEBOX_PORT/api/v1/cluster && echo READY"
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 900
